plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('STRING_ART_KEYSTORE')
def releaseKeystorePassword = System.getenv('STRING_ART_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('STRING_ART_KEY_ALIAS')
def releaseKeyPassword = System.getenv('STRING_ART_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.niuza.stringartreader2'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.niuza.stringartreader2'
        minSdk 26
        targetSdk 35
        versionCode 60
        versionName '26.3.4'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
